name: Production E2E smoke

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run production smoke
        run: npm run test:e2e:prod

      - name: Print summary
        if: always()
        run: node e2e/helpers/print-summary.mjs

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-prod-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
