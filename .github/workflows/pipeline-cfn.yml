name: Pipeline CloudFormation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "infrastructure/pipeline/**"
      - "buildspec.yml"
      - "buildspec-deploy.yml"
      - ".github/workflows/pipeline-cfn.yml"
  push:
    branches: [main, develop]
    paths:
      - "infrastructure/pipeline/**"
      - "buildspec.yml"
      - "buildspec-deploy.yml"
      - ".github/workflows/pipeline-cfn.yml"

jobs:
  cfn-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cfn-lint
        run: pip install cfn-lint
      - name: Lint pipeline template
        run: cfn-lint -t infrastructure/pipeline/template.yaml
