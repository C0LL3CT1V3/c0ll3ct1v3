# Production: pull pre-built images from ECR (build elsewhere, push with scripts/push-ecr.sh).
# Set ECR_REGISTRY in a root .env file, e.g.:
#   ECR_REGISTRY=756090160994.dkr.ecr.us-east-2.amazonaws.com

services:
  backend:
    image: ${ECR_REGISTRY}/c0ll3ct1v3-backend:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-change_me}@db:5432/collective
      - CORS_ORIGINS=${CORS_ORIGINS:-https://c0ll3ct1v3.xyz,https://www.c0ll3ct1v3.xyz}
      - REDIS_URL=redis://redis:6379/0
      - EPK_SIM_BASE_URL=${EPK_SIM_BASE_URL:-https://c0ll3ct1v3.xyz/api}
      - PUBLIC_SITE_DOMAIN=${PUBLIC_SITE_DOMAIN:-c0ll3ct1v3.xyz}
    depends_on:
      - db
      - redis

  media-worker:
    image: ${ECR_REGISTRY}/c0ll3ct1v3-worker:latest
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-change_me}@db:5432/collective
      - REDIS_URL=redis://redis:6379/0
      - EPK_SIM_BASE_URL=${EPK_SIM_BASE_URL:-https://c0ll3ct1v3.xyz/api}
      - PUBLIC_SITE_DOMAIN=${PUBLIC_SITE_DOMAIN:-c0ll3ct1v3.xyz}
    depends_on:
      - db
      - redis

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  frontend:
    image: ${ECR_REGISTRY}/c0ll3ct1v3-frontend:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/ssl:/etc/nginx/ssl
    depends_on:
      - backend

  db:
    image: postgres:13
    restart: unless-stopped
    environment:
      - POSTGRES_DB=collective
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change_me}
    volumes:
      - ./db_prod:/var/lib/postgresql/data
