default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: localhost
  port: 5434
  username: scoutroom
  password: scoutroom

development:
  <<: *default
  database: scoutroom_development

test:
  <<: *default
  database: scoutroom_test

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
